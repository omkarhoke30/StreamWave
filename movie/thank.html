<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Successfully Login

    </title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            box-sizing: border-box;
            color: white;
            background-color: black;
            text-decoration: none;
            /* height: 100vh; */
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        header {

            backdrop-filter: blur(12px);

            padding: 20px 0px;
            position: relative;
        }

        header::after {
            content: "";
            position: absolute;
            inset: 0;
            /* fixes left shift */
            background: radial-gradient(circle at bottom, rgb(90 90 240 / 69%), rgb(113 24 127 / 77%), #340c33);
            filter: blur(10px);
            z-index: -1;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .navbar img {
            width: 160px;
            height: auto;
        }

        .logo {
            margin: 0px 0;

        }

        .navbar {
            display: flex;
            justify-content: space-between;
            margin: 0px 30px;
            border-bottom: 2px solid #4c6286;
            align-items: center;
            flex-direction: row;
            padding: 10px;

        }

        @media (max-width:768px) {
            .navbar {
                flex-direction: column;
            }
        }

        nav {
            margin: 30px;
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 1.34rem;
            transition: all 0.3s ease;
            position: relative;
            margin: 0px 20px;
            font-weight: 600;
        }

        nav a:hover {

            color: #4c6286;

        }


        nav a::after {
            content: "";
            width: 0%;
            height: 4px;
            position: absolute;
            background: linear-gradient(to right, cyan, purple);
            font-size: 1.34rem;
            border-radius: 10px;
            margin: 5px auto;
            display: block;
            transition: 0.3s;

        }

        nav a:hover::after {
            width: 100%;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            color: aliceblue;
        }

        .main::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center,
                    rgb(90 90 240 / 60%),
                    rgb(113 24 127 / 70%),
                    #881cd6);
            filter: blur(80px);
            z-index: 0;
        }
        h1{
            position: relative;
            z-index: 1;
            color: aliceblue;
        }
    </style>
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <img src="../images/logo.png" alt="logo">
            </div>
            <nav>
                <a href="../home.html">Home</a>
            </nav>
        </div>

    </header>
    <div class="main">
        <h1> Successfully Login !! </h1>
        <h3>Thank you for Joining Us....</h3>
    </div>



</body>

</html>
