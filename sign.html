<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Full page background */
.login-page {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  background: black;
  overflow: hidden;
  font-family: sans-serif;
}

/* Glow background (same style as header) */
.login-page::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center,
    rgb(90 90 240 / 60%),
    rgb(113 24 127 / 70%),
    #000000
  );
  filter: blur(80px);
  z-index: 0;
}

/* Login box */
.login-box {
  position: relative;
  z-index: 1;
  width: 320px;
  padding: 30px;
  border-radius: 15px;

  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(15px);

  box-shadow: 0px 0px 20px rgba(0,255,255,0.2);
  text-align: center;
}

/* Heading */
.login-box h1 {
  margin-bottom: 10px;
  color: #fff;
}

.login-box p {
  font-size: 14px;
  color: #a8a5a5;
  margin-bottom: 20px;
}

/* Inputs */
.login-box input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;

  border-radius: 8px;
  border: none;
  outline: none;

  background: rgba(255,255,255,0.1);
  color: white;
}

/* Button (same gradient as your site) */
.login-box button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;

  border-radius: 30px;
  border: none;

  background: linear-gradient(to right, cyan, purple);
  color: white;

  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

.login-box button:hover {
  transform: scale(1.05);
}

/* Bottom text */
.login-box span {
  display: block;
  margin-top: 15px;
  font-size: 13px;
  color: #a8a5a5;
}
input::placeholder{
    color: #47d8da;
}

.login-box a {
  color: cyan;
  text-decoration: none;
}

    </style>
</head>
<body>
    
    <div class="login-page">

  <div class="login-box">
    <h1>Login</h1>
    <p>Login to continue streaming</p>

    <input type="email" placeholder="Enter Email" required>
    <input type="password" placeholder="Enter Password" required>

    <button type="submit"><a href="movie/thank.html">login</a></button>

    <span>Don't have an account? <a href="#">Register</a></span>
  </div>

</div>

</body>
</html>
